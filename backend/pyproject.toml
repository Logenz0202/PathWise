[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear
select = ["E", "F", "W", "I", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's intended pattern
ignore = ["B008"]
