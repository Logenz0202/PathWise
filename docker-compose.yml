services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pathwise-backend
    environment:
      # SQLite file in a named volume, so it survives rebuilds and stays out of the bind-mounted code
      DATABASE_URL: sqlite:////data/pathwise.db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it:free}
      APP_NAME: PathWise
      DEBUG: "true"
      # ./backend is mounted into the container; keep compiled .pyc files out of the project folder
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pathwise-frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    # node_modules lives in a container volume that outlives image rebuilds, so sync it with
    # package.json on every start
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  data:
